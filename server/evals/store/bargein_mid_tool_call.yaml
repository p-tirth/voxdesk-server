name: store_bargein_mid_tool_call

# Barge-in on a *tool-calling* turn: the caller cuts in on an order lookup and
# asks about something else entirely.
#
# This is the harder half of the interruption story. A plain barge-in only has
# to flush TTS audio; here there is also an in-flight function call, a tool
# result heading for the context, and an LLM response built on it. The failure
# this catches is the stale one — the bot finishing the abandoned order-status
# answer, or blending it into the reply to the new question.
#
#   uv run bot.py -t eval
#   uv run python -m pipecat.evals run evals/store/bargein_mid_tool_call.yaml -v
#
# ---------------------------------------------------------------------------
# WHERE THE INTERRUPTION LANDS — measured, not assumed
#
# Turn 1 asserts on BOTH the tool call and the bot's first spoken sentence, and
# turn 2 is anchored on that sentence. So the barge-in lands while the bot is
# *speaking the answer the tool produced*, with the tool result freshly in its
# context — not while the HTTP call is literally open.
#
# That distinction is deliberate, and the first version of this file got it
# wrong. Anchoring on `function_call` with no delay looks like it interrupts
# mid-flight and does not: `get_order_status` is a local lookup over
# data/store/orders.json that returns in single-digit milliseconds, and the
# caller's audio still has to be rendered by Kokoro and played into the bot's
# VAD at real-time cadence before anything can interrupt. Measured, the caller's
# speech arrived ~6s after the dispatch, the bot had not started speaking yet,
# and the two questions were simply answered together in one turn — a passing
# scenario that had tested nothing. `metrics/bargein.jsonl` gained no row, which
# is exactly how that was caught.
#
# Reaching a genuinely mid-flight interruption would need a slow tool, and
# faking one (a sleep in tools.py) would test the fake rather than the bot.
#
# `server/metrics/bargein.jsonl` is the proof the overlap was real — the
# observer only records one when the caller's speech starts while bot audio is
# playing. See bargein_mid_sentence.yaml for the full note on why
# `bot_interrupted` is not evidence.
# ---------------------------------------------------------------------------

user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
    sample_rate: 16000

# ---------------------------------------------------------------------------
# WHY `judge.modality: audio` BUT ASSERTIONS ON `llm_response`
#
# The modality is NOT optional here, and it is not about judging. A text-modality
# judge appends `skip_tts=true` to the bot's eval URL (see `_bot_url_with_flags`
# in pipecat/evals/harness.py), which silences the bot before any LLM runs —
# leaving nothing to barge into. Measured: with a text judge these scenarios
# passed in 13s each and metrics/bargein.jsonl gained no rows at all, because the
# bot never spoke. Audio modality is what makes the bot produce real TTS audio.
#
# But the *assertions* deliberately use `llm_response` (the bot's own text, which
# the harness emits in both modalities) rather than `response` (the transcription
# of its audio). The demo stack's TTS is Sarvam Bulbul on `hi-IN`, and the
# harness's only local bot-transcriber, Moonshine, is English-only: measured, it
# rendered a correct "we close at 9 PM ... 10 AM to 9 PM" as "We are open until
# no budget tonight. We hear from Das Pajee to Nobaje" — an answer no judge can
# score. Judging `llm_response` sidesteps the transcriber without weakening
# anything under test: the audio is still synthesized, still played, still what
# the caller's VAD-triggered interruption cuts off.
#
# (Whisper would read the accented English properly and would let these assert on
# `response`, but it isn't installed — `faster_whisper` is not a dependency of
# this project. That's the upgrade path if this ever needs a full spoken round
# trip. The `transcription:` block below is what the bare `response` barrier on
# the greeting turn uses; nothing else in the scenario is judged from audio.)
# ---------------------------------------------------------------------------
judge:
  modality: audio
  transcription:
    service: moonshine
    model: small-streaming
  eval: !include ../_shared/judge_eval.yaml

turns:
  # A pacing barrier, not an assertion — deliberately bare. `response` resolves
  # only when the greeting's *audio* has finished playing (the harness bounds it
  # on bot-stopped-speaking), so this is what stops the next turn from barging
  # into the greeting instead of into the answer it's supposed to interrupt. It
  # also drains the queue: `_next_matching_event` discards everything it pops on
  # the way to a match, so the greeting's `tts_response` segments are gone before
  # the next turn anchors on one. Asserting `llm_response` here instead does
  # neither, and the barge-in silently lands on the wrong turn — measured, that
  # left metrics/bargein.jsonl recording the *setup* question as the interruption
  # and nothing at all for the real one.
  #
  # No `eval:` on purpose: the greeting's content is already covered by
  # evals/store/greeting.yaml, and judging Moonshine's rendering of Sarvam's
  # hi-IN voice here would only add a flake.
  - expect:
      - event: response

  # Order 543131 is "shipped" (Air Fryer, BlueDart) in data/store/orders.json.
  # Both expectations matter: `function_call` proves the lookup ran, and
  # `tts_response` hands control back the moment the bot starts speaking the
  # result, rather than waiting for it to finish.
  - user: "Hi, can you check the status of order five four three one three one?"
    expect:
      - event: function_call
        calls:
          - name: get_order_status
      - event: tts_response

  # Cut into the tool-derived answer with an unrelated policy question (this one
  # routes to search_docs, a different tool).
  - send_after:
      event: tts_response
      delay_ms: 400
    user: "Wait, sorry, can I return something without the receipt?"
    expect:
      - event: bot_interrupted
      - event: llm_response
        eval: >
          the bot answers the question about returning something without a
          receipt — either explaining what the store's policy says about
          needing the receipt, or saying it doesn't have that information and
          offering to connect a human. It must NOT report the shipping or
          delivery status of the order instead.
