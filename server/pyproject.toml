[project]
name = "VoiceAgent"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
    "pipecat-ai[anthropic,cartesia,deepgram,evals,google,openai,runner,sarvam,silero,webrtc]>=1.4.0",
    "qdrant-client>=1.18.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
